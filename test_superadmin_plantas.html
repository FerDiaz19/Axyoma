<!DOCTYPE html>
<html>
<head>
    <title>Test SuperAdmin - Plantas</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .btn { padding: 10px 20px; margin: 5px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-primary { background: #007bff; color: white; }
        .result { margin: 20px 0; padding: 15px; border-radius: 4px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .info { background: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f2f2f2; }
        .status-true { color: green; font-weight: bold; }
        .status-false { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test SuperAdmin - Listar Plantas</h1>
        
        <div class="info result">
            <h3>📋 Información:</h3>
            <p>Este test verifica que el SuperAdmin puede ver todas las plantas del sistema.</p>
            <p><strong>Endpoint:</strong> GET /api/superadmin/listar_todas_plantas/</p>
        </div>

        <div id="userInfo"></div>
        
        <div>
            <button class="btn btn-primary" onclick="testSuperAdmin()">🔄 Probar SuperAdmin Plantas</button>
        </div>

        <div id="resultado"></div>
    </div>

    <script>
        async function testSuperAdmin() {
            const resultado = document.getElementById('resultado');
            const userInfo = document.getElementById('userInfo');
            
            try {
                // Obtener token del localStorage
                const token = localStorage.getItem('authToken');
                if (!token) {
                    resultado.innerHTML = '<div class="error result">❌ No hay token en localStorage. Por favor, inicie sesión primero.</div>';
                    return;
                }

                const headers = { 
                    'Authorization': `Token ${token}`,
                    'Content-Type': 'application/json'
                };

                // Obtener información del usuario
                const userResponse = await fetch('http://localhost:8000/api/auth/user_profile/', {
                    headers: headers
                });

                if (!userResponse.ok) {
                    throw new Error(`Error obteniendo perfil: ${userResponse.status}`);
                }

                const userData = await userResponse.json();
                
                userInfo.innerHTML = `
                    <div class="info result">
                        <h3>👤 Usuario Actual:</h3>
                        <p><strong>Username:</strong> ${userData.username}</p>
                        <p><strong>Nivel:</strong> ${userData.nivel_usuario}</p>
                        <p><strong>Es SuperAdmin:</strong> ${userData.nivel_usuario === 'superadmin' ? 'SÍ ✅' : 'NO ❌'}</p>
                    </div>
                `;

                if (userData.nivel_usuario !== 'superadmin') {
                    resultado.innerHTML = '<div class="error result">❌ Este test requiere permisos de SuperAdmin</div>';
                    return;
                }

                // Probar endpoint de SuperAdmin
                resultado.innerHTML = '<div class="info result">🔄 Cargando plantas...</div>';
                
                const plantasResponse = await fetch('http://localhost:8000/api/superadmin/listar_todas_plantas/', {
                    headers: headers
                });

                console.log('Response status:', plantasResponse.status);
                
                if (!plantasResponse.ok) {
                    const errorText = await plantasResponse.text();
                    throw new Error(`Error ${plantasResponse.status}: ${errorText}`);
                }

                const plantas = await plantasResponse.json();
                console.log('Plantas obtenidas:', plantas);
                
                if (!Array.isArray(plantas)) {
                    throw new Error('La respuesta no es un array de plantas');
                }

                // Mostrar resultados
                let html = `
                    <div class="success result">
                        <h3>✅ Plantas cargadas exitosamente (${plantas.length})</h3>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Dirección</th>
                                <th>Status</th>
                                <th>Empresa</th>
                                <th>Admin Planta</th>
                                <th>Departamentos</th>
                                <th>Empleados</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                plantas.forEach(planta => {
                    const statusClass = planta.status ? 'status-true' : 'status-false';
                    const statusText = planta.status ? 'Activa' : 'Inactiva';
                    const adminInfo = planta.admin_planta ? 
                        `${planta.admin_planta.nombre_completo} (${planta.admin_planta.username})` : 
                        'Sin asignar';
                    
                    html += `
                        <tr>
                            <td>${planta.planta_id}</td>
                            <td>${planta.nombre}</td>
                            <td>${planta.direccion || 'N/A'}</td>
                            <td class="${statusClass}">${statusText}</td>
                            <td>${planta.empresa.nombre}</td>
                            <td>${adminInfo}</td>
                            <td>${planta.departamentos_count || 0}</td>
                            <td>${planta.empleados_count || 0}</td>
                        </tr>
                    `;
                });

                html += `
                        </tbody>
                    </table>
                `;

                resultado.innerHTML = html;

            } catch (error) {
                console.error('Error:', error);
                resultado.innerHTML = `
                    <div class="error result">
                        <h3>❌ Error al cargar plantas</h3>
                        <p><strong>Error:</strong> ${error.message}</p>
                    </div>
                `;
            }
        }

        // Ejecutar automáticamente al cargar
        window.onload = () => {
            // Esperar un poco para que se cargue todo
            setTimeout(testSuperAdmin, 1000);
        };
    </script>
</body>
</html>
