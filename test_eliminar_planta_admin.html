<!DOCTYPE html>
<html>
<head>
    <title>Test Eliminar Planta - Admin Empresa</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .btn { padding: 10px 20px; margin: 5px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-primary { background: #007bff; color: white; }
        .result { margin: 20px 0; padding: 15px; border-radius: 4px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .info { background: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test Eliminar Planta - Admin Empresa</h1>
        
        <div class="info result">
            <h3>📋 Información:</h3>
            <p>Este test verifica que los administradores de empresa pueden eliminar plantas usando el nuevo endpoint.</p>
            <p><strong>Endpoint:</strong> DELETE /api/plantas/{id}/eliminar_planta_completa/</p>
        </div>

        <div id="userInfo"></div>
        
        <div id="plantasInfo"></div>

        <div>
            <button class="btn btn-primary" onclick="cargarDatos()">🔄 Cargar Datos</button>
            <button class="btn btn-danger" onclick="probarEliminar()" disabled id="btnEliminar">
                🗑️ Probar Eliminar (Selecciona una planta primero)
            </button>
        </div>

        <div id="resultado"></div>
    </div>

    <script>
        let plantaSeleccionada = null;
        let userToken = null;

        async function cargarDatos() {
            const resultado = document.getElementById('resultado');
            const userInfo = document.getElementById('userInfo');
            const plantasInfo = document.getElementById('plantasInfo');
            
            try {
                // Obtener token del localStorage
                userToken = localStorage.getItem('authToken');
                if (!userToken) {
                    resultado.innerHTML = '<div class="error result">❌ No hay token en localStorage. Por favor, inicie sesión primero.</div>';
                    return;
                }

                // Obtener información del usuario
                const userResponse = await fetch('http://localhost:8000/api/auth/user_profile/', {
                    headers: { 'Authorization': `Token ${userToken}` }
                });

                if (!userResponse.ok) {
                    throw new Error(`Error obteniendo perfil: ${userResponse.status}`);
                }

                const userData = await userResponse.json();
                
                userInfo.innerHTML = `
                    <div class="info result">
                        <h3>👤 Usuario Actual:</h3>
                        <p><strong>Username:</strong> ${userData.username}</p>
                        <p><strong>Nivel:</strong> ${userData.nivel_usuario}</p>
                        <p><strong>Empresa ID:</strong> ${userData.empresa_id || 'N/A'}</p>
                        <p><strong>Puede eliminar plantas:</strong> ${
                            userData.nivel_usuario === 'admin-empresa' || 
                            userData.nivel_usuario === 'superadmin' ? 'SÍ ✅' : 'NO ❌'
                        }</p>
                    </div>
                `;

                // Obtener plantas del usuario
                let plantasUrl = '/api/plantas/';
                if (userData.empresa_id) {
                    plantasUrl += `?empresa_id=${userData.empresa_id}&incluir_suspendidas=true`;
                }

                const plantasResponse = await fetch(`http://localhost:8000${plantasUrl}`, {
                    headers: { 'Authorization': `Token ${userToken}` }
                });

                if (!plantasResponse.ok) {
                    throw new Error(`Error obteniendo plantas: ${plantasResponse.status}`);
                }

                const plantas = await plantasResponse.json();
                
                let plantasHtml = `
                    <div class="info result">
                        <h3>🏭 Plantas Disponibles:</h3>
                `;

                if (plantas.length === 0) {
                    plantasHtml += '<p>No hay plantas disponibles.</p>';
                } else {
                    plantasHtml += '<div>';
                    plantas.forEach(planta => {
                        plantasHtml += `
                            <div style="margin: 10px 0; padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
                                <input type="radio" name="planta" value="${planta.planta_id}" 
                                       onchange="seleccionarPlanta(${planta.planta_id}, '${planta.nombre}')">
                                <strong>${planta.nombre}</strong> 
                                <span style="color: ${planta.status ? 'green' : 'red'};">
                                    (${planta.status ? 'Activa' : 'Inactiva'})
                                </span>
                                <br>
                                <small>ID: ${planta.planta_id} | Empresa: ${planta.empresa_nombre || 'N/A'}</small>
                            </div>
                        `;
                    });
                    plantasHtml += '</div>';
                }

                plantasHtml += '</div>';
                plantasInfo.innerHTML = plantasHtml;

                resultado.innerHTML = '<div class="success result">✅ Datos cargados correctamente.</div>';

            } catch (error) {
                console.error('Error:', error);
                resultado.innerHTML = `<div class="error result">❌ Error: ${error.message}</div>`;
            }
        }

        function seleccionarPlanta(id, nombre) {
            plantaSeleccionada = { id, nombre };
            const btnEliminar = document.getElementById('btnEliminar');
            btnEliminar.disabled = false;
            btnEliminar.textContent = `🗑️ Eliminar "${nombre}"`;
        }

        async function probarEliminar() {
            if (!plantaSeleccionada) {
                alert('Seleccione una planta primero');
                return;
            }

            const confirmacion = confirm(
                `⚠️ ¿Está seguro de que desea ELIMINAR COMPLETAMENTE la planta "${plantaSeleccionada.nombre}"?\n\n` +
                `Esta acción es IRREVERSIBLE y eliminará:\n` +
                `• La planta\n` +
                `• Todos los departamentos\n` +
                `• Todos los puestos\n` +
                `• Todos los empleados\n` +
                `• El administrador de planta\n\n` +
                `¿Continuar?`
            );

            if (!confirmacion) return;

            const resultado = document.getElementById('resultado');

            try {
                const response = await fetch(
                    `http://localhost:8000/api/plantas/${plantaSeleccionada.id}/eliminar_planta_completa/`,
                    {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Token ${userToken}`,
                            'Content-Type': 'application/json'
                        }
                    }
                );

                const data = await response.json();

                if (response.ok) {
                    resultado.innerHTML = `
                        <div class="success result">
                            <h3>✅ Planta eliminada exitosamente</h3>
                            <p><strong>Mensaje:</strong> ${data.message}</p>
                            <h4>📊 Entidades eliminadas:</h4>
                            <ul>
                                <li>Plantas: ${data.entidades_eliminadas.planta}</li>
                                <li>Departamentos: ${data.entidades_eliminadas.departamentos}</li>
                                <li>Puestos: ${data.entidades_eliminadas.puestos}</li>
                                <li>Empleados: ${data.entidades_eliminadas.empleados}</li>
                                <li>Admin planta: ${data.entidades_eliminadas.admin_planta}</li>
                            </ul>
                        </div>
                    `;
                    
                    // Recargar datos
                    setTimeout(() => cargarDatos(), 2000);
                } else {
                    resultado.innerHTML = `
                        <div class="error result">
                            <h3>❌ Error al eliminar planta</h3>
                            <p><strong>Error:</strong> ${data.error || 'Error desconocido'}</p>
                            <p><strong>Status:</strong> ${response.status}</p>
                        </div>
                    `;
                }

            } catch (error) {
                console.error('Error:', error);
                resultado.innerHTML = `
                    <div class="error result">
                        <h3>❌ Error de conexión</h3>
                        <p><strong>Error:</strong> ${error.message}</p>
                    </div>
                `;
            }
        }

        // Cargar datos al inicio
        window.onload = cargarDatos;
    </script>
</body>
</html>
